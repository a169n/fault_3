# PodDisruptionBudget: voluntary disruptions (node drain, cluster upgrade)
# may never take down both Registration replicas at the same time.
apiVersion: policy/v1
kind: PodDisruptionBudget
metadata:
  name: registration-service-pdb
  namespace: aitu-sss
spec:
  minAvailable: 1
  selector:
    matchLabels:
      app: registration-service
