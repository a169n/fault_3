# Lab helper: in-cluster client that calls the Registration Service through
# its Service DNS name every 200 ms and prints the HTTP status code.
# Timestamps are added by `kubectl logs --timestamps` (works the same on macOS/Linux).
# Used to measure user impact during the failure experiments (Part D).
apiVersion: v1
kind: Pod
metadata:
  name: load-generator
  namespace: aitu-sss
  labels:
    app: load-generator
spec:
  restartPolicy: Never
  containers:
    - name: curl
      image: curlimages/curl:8.10.1
      command:
        - sh
        - -c
        - |
          i=0
          while true; do
            i=$((i+1))
            code=$(curl -s -o /dev/null -m 2 -w '%{http_code}' \
                   -H 'Content-Type: application/json' \
                   -d "{\"student_id\":\"S$((i % 500))\",\"course_code\":\"CC-301\"}" \
                   http://registration-service.aitu-sss.svc.cluster.local/api/v1/registrations)
            echo "$code"
            sleep 0.2
          done
      resources:
        requests:
          cpu: 20m
          memory: 16Mi
        limits:
          cpu: 200m
          memory: 64Mi
