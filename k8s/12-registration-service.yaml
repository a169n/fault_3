# Registration Service - Service (service discovery + load balancing).
# Other services (API Gateway) reach it by DNS name:
#   registration-service.aitu-sss.svc.cluster.local:80
apiVersion: v1
kind: Service
metadata:
  name: registration-service
  namespace: aitu-sss
  labels:
    app: registration-service
spec:
  type: ClusterIP
  selector:
    app: registration-service
  ports:
    - name: http
      port: 80
      targetPort: http
      protocol: TCP
