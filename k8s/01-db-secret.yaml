# SYNTHETIC lab credentials only. Not real AITU credentials.
# In a real deployment this Secret would come from a secret manager
# (e.g. External Secrets / Sealed Secrets), never from Git.
apiVersion: v1
kind: Secret
metadata:
  name: registration-db-credentials
  namespace: aitu-sss
type: Opaque
stringData:
  POSTGRES_DB: registration
  POSTGRES_USER: registration_app
  POSTGRES_PASSWORD: synthetic-lab-password-change-me
