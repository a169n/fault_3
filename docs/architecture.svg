<svg xmlns="http://www.w3.org/2000/svg" width="1000" height="760" viewBox="0 0 1000 760" font-family="Helvetica, Arial, sans-serif">
  <defs>
    <marker id="arr" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse">
      <path d="M0,0 L10,5 L0,10 z" fill="#444"/>
    </marker>
    <style>
      .t { font-size: 14px; fill: #1a1a1a; }
      .s { font-size: 11.5px; fill: #444; }
      .h { font-size: 13px; font-weight: bold; fill: #1a1a1a; }
      .box { fill: #ffffff; stroke: #4a6fa5; stroke-width: 1.6; rx: 8; }
      .new { fill: #fff6e5; stroke: #d97706; stroke-width: 2; stroke-dasharray: 6 4; rx: 8; }
      .svc { fill: #eef4fb; stroke: #4a6fa5; stroke-width: 1.4; rx: 8; }
      .pod { fill: #ffffff; stroke: #4a6fa5; stroke-width: 1.2; rx: 5; }
      .reg { fill: #e8f5e9; stroke: #2e7d32; stroke-width: 2; rx: 8; }
      .db  { fill: #f3e8fd; stroke: #7b3fb5; stroke-width: 1.6; rx: 8; }
      .dr  { fill: #f5f5f5; stroke: #777; stroke-width: 1.4; rx: 8; }
      .ln  { stroke: #444; stroke-width: 1.5; fill: none; marker-end: url(#arr); }
      .dash { stroke: #7b3fb5; stroke-width: 1.5; fill: none; stroke-dasharray: 5 4; marker-end: url(#arr); }
    </style>
  </defs>

  <rect width="1000" height="760" fill="#ffffff"/>
  <text x="500" y="30" text-anchor="middle" style="font-size:18px;font-weight:bold">AITU Digital Student Services — resilient architecture (synthetic)</text>
  <text x="500" y="50" text-anchor="middle" class="s">Users → Load Balancer → API Gateway → Auth / Course / Registration → Database   ·   orange dashed = redundancy added by this design</text>

  <!-- Users -->
  <rect x="420" y="66" width="160" height="44" class="box"/>
  <text x="500" y="86" text-anchor="middle" class="h">Students / staff</text>
  <text x="500" y="102" text-anchor="middle" class="s">10,000 users · 500 req/s peak</text>
  <path d="M480 110 L400 132" class="ln"/>
  <path d="M520 110 L600 132" class="ln"/>

  <!-- Load balancers -->
  <rect x="300" y="134" width="180" height="50" class="box"/>
  <text x="390" y="155" text-anchor="middle" class="h">Load Balancer #1</text>
  <text x="390" y="172" text-anchor="middle" class="s">99.95% · health checks</text>
  <rect x="520" y="134" width="180" height="50" class="new"/>
  <text x="610" y="155" text-anchor="middle" class="h">Load Balancer #2</text>
  <text x="610" y="172" text-anchor="middle" class="s">active-active (recommended)</text>

  <!-- Kubernetes cluster -->
  <rect x="40" y="212" width="920" height="304" fill="#fbfcfe" stroke="#9aa9bd" stroke-width="1.4" stroke-dasharray="3 3" rx="12"/>
  <text x="56" y="234" class="h">Kubernetes cluster</text>
  <text x="56" y="252" class="s">namespace aitu-sss</text>
  <text x="56" y="268" class="s">≥ 2 worker nodes,</text>
  <text x="56" y="284" class="s">anti-affinity spreads pods</text>

  <path d="M390 184 L390 242" class="ln"/>
  <path d="M610 184 L610 242" class="ln"/>
  <path d="M420 184 L580 242" class="ln" opacity="0.45"/>
  <path d="M580 184 L420 242" class="ln" opacity="0.45"/>
  <!-- API Gateway -->
  <rect x="300" y="244" width="180" height="50" class="box"/>
  <text x="390" y="265" text-anchor="middle" class="h">API Gateway #1</text>
  <text x="390" y="282" text-anchor="middle" class="s">99.90% · routing, auth check</text>
  <rect x="520" y="244" width="180" height="50" class="new"/>
  <text x="610" y="265" text-anchor="middle" class="h">API Gateway #2</text>
  <text x="610" y="282" text-anchor="middle" class="s">KEY CHANGE (bottleneck fix)</text>
  <text x="720" y="265" class="s" style="fill:#b45309;font-weight:bold">2 gateways:</text>
  <text x="720" y="282" class="s" style="fill:#b45309;font-weight:bold">99.90% → 99.9999%</text>

  <path d="M390 294 L190 336" class="ln"/>
  <path d="M390 294 L480 336" class="ln"/>
  <path d="M610 294 L520 336" class="ln"/>
  <path d="M610 294 L810 336" class="ln"/>

  <!-- Services -->
  <rect x="80" y="338" width="220" height="150" class="svc"/>
  <text x="190" y="358" text-anchor="middle" class="h">Auth Service</text>
  <text x="190" y="374" text-anchor="middle" class="s">Service: auth-service (ClusterIP)</text>
  <rect x="95" y="384" width="90" height="42" class="pod"/><text x="140" y="402" text-anchor="middle" class="s">auth pod 1</text><text x="140" y="417" text-anchor="middle" class="s">99.5%</text>
  <rect x="195" y="384" width="90" height="42" class="pod"/><text x="240" y="402" text-anchor="middle" class="s">auth pod 2</text><text x="240" y="417" text-anchor="middle" class="s">99.5%</text>
  <text x="190" y="450" text-anchor="middle" class="t">2 replicas → 99.9975%</text>
  <text x="190" y="470" text-anchor="middle" class="s">JWT validation, login</text>

  <rect x="390" y="338" width="220" height="150" class="svc"/>
  <text x="500" y="358" text-anchor="middle" class="h">Course Service</text>
  <text x="500" y="374" text-anchor="middle" class="s">Service: course-service (ClusterIP)</text>
  <rect x="405" y="384" width="90" height="42" class="pod"/><text x="450" y="402" text-anchor="middle" class="s">course pod 1</text><text x="450" y="417" text-anchor="middle" class="s">99.5%</text>
  <rect x="505" y="384" width="90" height="42" class="pod"/><text x="550" y="402" text-anchor="middle" class="s">course pod 2</text><text x="550" y="417" text-anchor="middle" class="s">99.5%</text>
  <text x="500" y="450" text-anchor="middle" class="t">2 replicas → 99.9975%</text>
  <text x="500" y="470" text-anchor="middle" class="s">timetable, course info (cacheable)</text>

  <rect x="700" y="338" width="220" height="150" class="reg"/>
  <text x="810" y="358" text-anchor="middle" class="h">Registration Service</text>
  <text x="810" y="374" text-anchor="middle" class="s">registration-service.aitu-sss.svc</text>
  <rect x="715" y="384" width="90" height="42" class="pod"/><text x="760" y="402" text-anchor="middle" class="s">reg pod 1</text><text x="760" y="417" text-anchor="middle" class="s">99.5%</text>
  <rect x="815" y="384" width="90" height="42" class="pod"/><text x="860" y="402" text-anchor="middle" class="s">reg pod 2</text><text x="860" y="417" text-anchor="middle" class="s">99.5%</text>
  <text x="810" y="450" text-anchor="middle" class="t">2 replicas → 99.9975%</text>
  <text x="810" y="470" text-anchor="middle" class="s">probes · PDB minAvailable 1</text>

  <path d="M190 488 L320 556" class="ln"/>
  <path d="M500 488 L380 556" class="ln"/>
  <path d="M810 488 L440 556" class="ln"/>
  <text x="790" y="535" class="s">all writes go to the primary</text>

  <!-- Database -->
  <rect x="260" y="558" width="200" height="62" class="db"/>
  <text x="360" y="580" text-anchor="middle" class="h">PostgreSQL primary</text>
  <text x="360" y="597" text-anchor="middle" class="s">node 1 · 99.7% · zone A</text>
  <text x="360" y="612" text-anchor="middle" class="s">read / write</text>
  <rect x="540" y="558" width="200" height="62" class="db"/>
  <text x="640" y="580" text-anchor="middle" class="h">PostgreSQL standby</text>
  <text x="640" y="597" text-anchor="middle" class="s">node 2 · 99.7% · zone B</text>
  <text x="640" y="612" text-anchor="middle" class="s">auto-failover (Patroni / CNPG)</text>
  <path d="M460 589 L538 589" class="dash"/>
  <text x="500" y="580" text-anchor="middle" class="s">streaming</text>
  <text x="500" y="606" text-anchor="middle" class="s">replication</text>
  <text x="560" y="644" text-anchor="middle" class="t">2 nodes → 99.9991% · RPO ≈ seconds on node failure</text>

  <!-- DR -->
  <rect x="40" y="664" width="920" height="80" class="dr"/>
  <text x="58" y="686" class="h">Disaster recovery (separate from HA) — off-cluster, other zone / region</text>
  <text x="58" y="708" class="s">• Base backup daily 02:00 + continuous WAL archiving (archive_timeout 60 s) → object storage · RPO ≤ 1–5 min · PITR tested (results/dr_drill.log)</text>
  <text x="58" y="726" class="s">• All Kubernetes YAML in Git (GitOps) → cluster re-created with kubectl apply · logical pg_dump every 5 min (CronJob) as second copy</text>
  <path d="M270 620 L270 662" class="dash"/>
</svg>
